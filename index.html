<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyType</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>PyType</h1>
    <p>Practice typing programming syntax.</p>

    <pre id="target-code"></pre>

    <textarea id="user-input"
              placeholder="Start typing..."
              spellcheck="false"></textarea>

    <p id="accuracy" class="stat">Accuracy: 100%</p>
    <p id="wpm" class="stat">WPM: 0</p>
    <p id="errors" class="stat">Errors: 0</p>

    <button id="restart">Restart</button>

    <script src="script.js"></script>
</body>
</html>
